  # ── GDPPC IDEAS ──────────────────────────────────────────────────────────────

  idea_GDPPC_Abject:0 "§RAbject Standards of Living§!"
  idea_GDPPC_Abject_desc:0 "§YLevel§! §R1§! §YDevelopment§!\n\n§YRelative Standing:§! §RBottom 12% of World Average§! §7(World Avg: [?global.average_GDP_per_capita|0])§!\n§YFloor Required:§! §Wno minimum§!\n\n§CRefreshes Every Quarter§!\n\n§RThe population does not have an economy. It has a survival problem.§! Caloric intake is below 1,500 a day. Infant mortality is a census figure, not a tragedy. The state, where it exists at all, is a rumor in the capital and a boot on the ground everywhere else. No roads that survive the rains. No schools worth the name. No hospitals. §RThe administrative apparatus costs more to run than it collects.§!\n\nResearch crawls. Factories, if they exist, run on exhausted labour and produce almost nothing. §RAny sustained military effort will collapse this economy within months.§!"

  idea_GDPPC_Squalid:0 "§RSqualid Standards of Living§!"
  idea_GDPPC_Squalid_desc:0 "§YLevel§! §R2§! §YDevelopment§!\n\n§YRelative Standing:§! §RBelow 22% of World Average§! §7(World Avg: [?global.average_GDP_per_capita|0])§!\n§YFloor Required:§! §W$15 GDPPC§!\n\n§CRefreshes Every Quarter§!\n\n§RThe village is the entire world.§! Currency exists but most people have never handled it. The tax collector and the soldier are the only government representatives most citizens will ever see. Literacy is a landlord's privilege. Children work as soon as they can carry something, and debt is not a temporary condition — §Rit is the family inheritance.§!\n\n§OResearch is severely hampered. Political cohesion is fragile. Manpower is abundant but untrained and difficult to keep in the field without rapid equipment loss.§!"

  idea_GDPPC_Hardscrabble:0 "§OHardscrabble Standards of Living§!"
  idea_GDPPC_Hardscrabble_desc:0 "§YLevel§! §O3§! §YDevelopment§!\n\n§YRelative Standing:§! §OBelow 35% of World Average§! §7(World Avg: [?global.average_GDP_per_capita|0])§!\n\n§CRefreshes Every Quarter§!\n\nFloor Required:§! §W$35 GDPPC§!\n\n§OSubsistence farming is the national industry, pastime, and destiny.§! A good harvest means the family eats. A bad one means the family borrows — and the debt outlasts the generation. Schoolhouses operate a few months a year, when the children aren't needed in the fields. §OThere is a telegraph office in the provincial capital. There are no trains.§!\n\n§YResearch is slow but not dead. Light industry is possible. The army can fight but cannot be sustained in a long offensive without stripping the countryside of everything it produces.§!"

  idea_GDPPC_Grimy:0 "§OGrimy Standards of Living§!"
  idea_GDPPC_Grimy_desc:0 "§YLevel§! §O4§! §YDevelopment§!\n\n§YRelative Standing:§! §OBelow 52% of World Average§! §7(World Avg: [?global.average_GDP_per_capita|0])§!\n§YFloor Required:§! §W$80 GDPPC§!\n\n§CRefreshes Every Quarter§!\n\n§OThe industrial revolution has arrived. It has not brought liberation — it has brought the factory.§! Twelve-hour shifts, coal-thick air, tenements stacked so close that sunlight is seasonal. Life expectancy peaks in the mid-forties if the lungs hold out. Children who don't work in fields now work in mills. §OThe city is growing. It is not yet a place anyone would choose to live.§!\n\n§YIndustry is real and expanding. Research is possible with effort. The military-industrial base can sustain a limited war, but attrition will bite fast.§!"

  idea_GDPPC_Meager:0 "§OMiddling Standards of Living§!"
  idea_GDPPC_Meager_desc:0 "§YLevel§! §O5§! §YDevelopment§!\n\n§YRelative Standing:§! §YBelow 75% of World Average§! §7(World Avg: [?global.average_GDP_per_capita|0])§!\n§YFloor Required:§! §W$150 GDPPC§!\n\n§CRefreshes Every Quarter§!\n\n§YBasic needs are technically met.§! There is bread most days, shoes that mostly fit, a roof that mostly holds. But one illness, one failed crop, one lost job separates the family from genuine destitution. §OThe state provides almost nothing. Education exists but is not universal. Medicine exists but is not affordable.§! Wages cover necessities and nothing else. There is no savings. There is no safety net.\n\n§YA real economy. Real factories. A military force capable of sustained operations — though it will feel the strain of a prolonged war before its enemies do.§!"

  idea_GDPPC_Decent:0 "§LDecent Standards of Living§!"
  idea_GDPPC_Decent_desc:0 "§YLevel§! §L6§! §YDevelopment§!\n\n§YRelative Standing:§! §LAt 75% of World Average§! §7(World Avg: [?global.average_GDP_per_capita|0])§!\n§YFloor Required:§! §W$300 GDPPC§!\n\n§CRefreshes Every Quarter§!\n\n§LThe global baseline of a functioning society.§! A radio in the parlor. Children who can reasonably expect to finish primary school. Work is hard but not inhuman — enough hours to live on, with enough left at week's end for a meal that isn't pure starch. §GThe doctor is expensive but exists. The newspaper arrives by train.§! Most of humanity lives here, and most of humanity has lived worse.\n\n§GA serious industrial power. Research proceeds at a real pace. Capable of sustained warfare — not comfortable with it, but capable.§!"

  idea_GDPPC_Comfortable:0 "§LComfortable Standards of Living§!"
  idea_GDPPC_Comfortable_desc:0 "§YLevel§! §L7§! §YDevelopment§!\n\n§YRelative Standing:§! §LAbove 105% of World Average§! §7(World Avg: [?global.average_GDP_per_capita|0])§!\n§YFloor Required:§! §W$500 GDPPC§!\n\n§CRefreshes Every Quarter§!\n\n§LIndoor plumbing is universal rather than aspirational.§! The middle class is not just a category — it is a constituency with opinions about tariffs and municipal parks. Workers have weekends. Secondary education is becoming the norm. §LThe future feels, for the first time in history for most citizens, genuinely open.§! Wealth exists here — not evenly, but visibly.\n\n§GOne of the world's advanced economies. Research accelerates. The military-industrial complex can sustain a major war without gutting civilian output — though the population will notice.§!"

  idea_GDPPC_Robust:0 "§GRobust Standards of Living§!"
  idea_GDPPC_Robust_desc:0 "§YLevel§! §G8§! §YDevelopment§!\n\n§YRelative Standing:§! §GAbove 1.40× World Average§! §7(World Avg: [?global.average_GDP_per_capita|0])§!\n§YFloor Required:§! §W$800 GDPPC§!\n\n§CRefreshes Every Quarter§!\n\n§GHigh-protein diets, modern medicine, and regulated hours have remade the workforce.§! Workers are healthier, taller, and better educated than any previous generation. Refrigerators are in most kitchens. Automobiles are within reach of the ambitious. Organized labour has won enough concessions that §Gthe factory floor is no longer a place of casual brutality.§!\n\n§GAmong the wealthiest economies on earth. Research is aggressive and well-funded. The army enters war with a trained, healthy, motivated force — and the industrial depth to keep it supplied.§!"

  idea_GDPPC_Vibrant:0 "§GVibrant Standards of Living§!"
  idea_GDPPC_Vibrant_desc:0 "§YLevel§! §G9§! §YDevelopment§!\n\n§YRelative Standing:§! §GAbove 1.85× World Average§! §7(World Avg: [?global.average_GDP_per_capita|0])§!\n§YFloor Required:§! §W$1,200 GDPPC§!\n\n§CRefreshes Every Quarter§!\n\n§GConsumer culture has ignited.§! Advertising is a profession. Fashion changes seasonally. The city at night is lit and alive. Higher education is becoming accessible to the working class. §GThe economy is driven as much by what citizens buy as by what they produce — domestic demand is now a meaningful economic force in its own right.§!\n\n§GExceptional prosperity. Research institutions are world-class. The military-industrial base can sustain total war without rationing civilian consumption into crisis.§!"

  idea_GDPPC_Prosperous:0 "§GProsperous Standards of Living§!"
  idea_GDPPC_Prosperous_desc:0 "§YLevel§! §G10§! §YDevelopment§!\n\n§YRelative Standing:§! §GAbove 2.50× World Average§! §7(World Avg: [?global.average_GDP_per_capita|0])§!\n§YFloor Required:§! §W$1,800 GDPPC§!\n\n§CRefreshes Every Quarter§!\n\n§GPrivate automobiles are a right, not a luxury.§! Suburbia sprawls outward from every city. The state provides education, healthcare, and infrastructure as baseline expectations rather than political promises. The average citizen has savings, insurance, and a pension on the distant horizon. §GThe material concerns that defined all prior human history are, for most people, largely solved.§!\n\n§YRarity:§! §CRemarkable prosperity. Requires sustained economic expansion. Research is among the world's fastest. Wartime production ramps faster than enemies can respond.§!"

  idea_GDPPC_Opulent:0 "§GOpulent Standards of Living§!"
  idea_GDPPC_Opulent_desc:0 "§YLevel§! §G11§! §YDevelopment§!\n\n§YRelative Standing:§! §GAbove 3.40× World Average§! §7(World Avg: [?global.average_GDP_per_capita|0])§!\n§YFloor Required:§! §W$2,500 GDPPC§!\n\n§CRefreshes Every Quarter§!\n\n§GDomestic automation has begun its quiet revolution.§! Machines wash clothes, dishes, and floors. The professional class has expanded so dramatically that white-collar workers outnumber blue-collar in some sectors. Foreign travel is a middle-class expectation. §GLeisure has become an industry in its own right, and citizens are genuinely good at it.§!\n\n§YRarity:§! §CVery Rare. At this level of prosperity, the population actively resists industrial conscription — arms factory output suffers as wealthy citizens find ways to avoid weapons work. Strategic depth compensates.§!"

  idea_GDPPC_Gilded:0 "§CGilded Standards of Living§!"
  idea_GDPPC_Gilded_desc:0 "§YLevel§! §C12§! §YDevelopment§!\n\n§YRelative Standing:§! §CAbove 4.50× World Average§! §7(World Avg: [?global.average_GDP_per_capita|0])§!\n§YFloor Required:§! §W$3,600 GDPPC§!\n\n§CRefreshes Every Quarter§!\n\n§CElectrification is total and reliable. High-speed transit connects every city.§! The smog of the early industrial age is a memory preserved in old photographs. The average home is fully wired and stocked with machinery that would have seemed miraculous to the previous generation. §CThe population is long-lived, well-fed, and highly educated — and they know it.§!\n\n§YRarity:§! §CExtremely Rare. Far beyond the global standard. The armed forces are the best-equipped, best-fed, and best-trained on earth. The population endures war rather than embracing it.§!"

  idea_GDPPC_Radiant:0 "§CRadiant Standards of Living§!"
  idea_GDPPC_Radiant_desc:0 "§YLevel§! §C13§! §YDevelopment§!\n\n§YRelative Standing:§! §CAbove 6.00× World Average§! §7(World Avg: [?global.average_GDP_per_capita|0])§!\n§YFloor Required:§! §W$5,000 GDPPC§!\n\n§CRefreshes Every Quarter§!\n\n§CUniversal higher education has produced a nation where expertise is the norm.§! Scientific research is generously funded and aggressively pursued. The working week continues to shrink as automation absorbs more labour. §CCitizens debate philosophy and urban planning in the same breath as sport scores. This civilization is operating near the peak of what modern thought considers possible.§!\n\n§YRarity:§! §WNear-Impossible. Requires extraordinary circumstances. Research output is unmatched. Arms production is the only constraint on military power.§!"

  idea_GDPPC_Transcendental:0 "§CTranscendental Standards of Living§!"
  idea_GDPPC_Transcendental_desc:0 "§YLevel§! §C14§! §YDevelopment§!\n\n§YRelative Standing:§! §CAbove 7.50× World Average§! §7(World Avg: [?global.average_GDP_per_capita|0])§!\n§YFloor Required:§! §W$6,500 GDPPC§!\n\n§CRefreshes Every Quarter§!\n\n§CPost-scarcity in food and energy has arrived.§! The agricultural and energy sectors run on automation so complete that only a fraction of the workforce touches them. Cities are clean, luminous, and rationally planned. Medicine has pushed life expectancy to extraordinary lengths. §CThe state has essentially solved poverty as a material condition. Citizens now debate problems of meaning that previous generations would have called indulgent.§!\n\n§YRarity:§! §WAlmost Impossible. This economy funds science, military, and welfare simultaneously without strain. The armed forces are a generational leap ahead of any peer.§!"

  idea_GDPPC_Utopian:0 "§WUtopian Standards of Living§!"
  idea_GDPPC_Utopian_desc:0 "§WHighest Development Level§!\n§YRelative Standing:§! §WAbove 9.00× World Average§! §7(World Avg: [?global.average_GDP_per_capita|0])§!\n§YFloor Required:§! §W$8,200 GDPPC§!\n\n§CRefreshes Every Quarter§!\n\n§WABSOLUTE PROSPERITY§!\n\n§CThis number sits beyond the horizon of what any known economy has achieved. It is the terminal point of a progression that reality has not yet reached.§! §WPerfect health§! maintained by medicine that borders on the miraculous. §WTotal automation§! of all labour that can be automated. A population that has so thoroughly forgotten what material want feels like that the word §Wpoverty§! is studied alongside plague and serfdom.\n\n§WThis is the ceiling. There is nothing above this.§!\n§RHighest Development Level Reached§!"

  # ── GDP SIZE IDEAS ────────────────────────────────────────────────────────────

  idea_GDP_Primitive:0 "§RPrimitive Economy§!"
  idea_GDP_Primitive_desc:0 "§YLevel§! §R1§! §YEconomy Size§!\n\n§YRelative Standing:§! §RBelow 0.03% of World Economy§! §7(Your Share: [?percentage_of_GDP|0..2]%)§!\n§YFloor Required:§! §Wno minimum§!\n\n§CRefreshes Every Month§!\n\n§RThere is no formal economy here in any meaningful sense.§! Currency circulates erratically and is trusted by almost no one. Exchange is conducted in grain, livestock, and favors. §RThe state budget could be managed by a careful household accountant.§! No banking sector. No industrial output worth measuring. No trade policy — because there is nothing to trade and nowhere to trade it. On the global ledger, this economy is a rounding error.\n\n§OA nation in name. Economically, almost invisible. Construction is a matter of hand tools and oxen.§!"

  idea_GDP_Negligible:0 "§RNegligible Economy§!"
  idea_GDP_Negligible_desc:0 "§YLevel§! §R2§! §YEconomy Size§!\n\n§YRelative Standing:§! §RAbove 0.03% of World Economy§! §7(Your Share: [?percentage_of_GDP|0..2]%)§!\n§YFloor Required:§! §W$0.05B§!\n\n§CRefreshes Every Month§!\n\n§RA statistical footnote in the world economy.§! The entire national output can be disrupted by a single bad harvest, a collapsed mine, or a foreign company relocating. There is perhaps one major export, and §Rthe entire fiscal architecture of the state depends on it.§! One bad year in the commodity markets means the government cannot pay its officials. The economy exists, technically — on borrowed time and borrowed money.\n\n§OSmall, but not without potential. Naval construction and heavy industry are functionally impossible without outside assistance.§!"

  idea_GDP_Peripheral:0 "§OPeripheral Economy§!"
  idea_GDP_Peripheral_desc:0 "§YLevel§! §O3§! §YEconomy Size§!\n\n§YRelative Standing:§! §OAbove 0.08% of World Economy§! §7(Your Share: [?percentage_of_GDP|0..2]%)§!\n§YFloor Required:§! §W$0.15B§!\n\n§CRefreshes Every Month§!\n\n§OThis nation exists on the margins of the global economy — present enough to appear on trade ledgers, not significant enough to influence them.§! Raw materials flow outward, manufactured goods flow inward. §OThe terms of exchange are set entirely by others.§! Industry is nascent and entirely dependent on imported capital and expertise.\n\n§YMaking its presence felt. Capable of arming and fielding a basic force, but heavy equipment will need to be purchased or captured.§!"

  idea_GDP_Rudimentary:0 "§ORudimentary Economy§!"
  idea_GDP_Rudimentary_desc:0 "§YLevel§! §O4§! §YEconomy Size§!\n\n§YRelative Standing:§! §OAbove 0.20% of World Economy§! §7(Your Share: [?percentage_of_GDP|0..2]%)§!\n§YFloor Required:§! §W$0.40B§!\n\n§CRefreshes Every Month§!\n\n§OThe first genuine stirrings of an organized economy.§! A railway line connects the capital to the port. A factory district produces something the country used to import. §YA central bank has been established§!, though its reserves are thin and its credibility is newer than its building. Roads are being built. The telegraph reaches most major towns.\n\n§YA nation finding its economic voice. Light industry is real. A short war is winnable — a long one will expose the limits fast.§!"

  idea_GDP_Developing:0 "§ODeveloping Economy§!"
  idea_GDP_Developing_desc:0 "§YLevel§! §O5§! §YEconomy Size§!\n\n§YRelative Standing:§! §YAbove 0.50% of World Economy§! §7(Your Share: [?percentage_of_GDP|0..2]%)§!\n§YFloor Required:§! §W$0.90B§!\n\n§CRefreshes Every Month§!\n\n§YGrowing, but fragile§! in the way that adolescent things are fragile — full of momentum and very vulnerable to a single misstep. There are real industries, real exports beyond raw commodities, §Ya manufacturing sector§! that employs a meaningful fraction of the workforce. But the economy rests on a narrow base, and any external shock reverberates through the entire system.\n\n§YSolid enough to fight a real war, if needed. Industrial substitution after losses will be slow and painful.§!"

  idea_GDP_Moderate:0 "§LModerate Economy§!"
  idea_GDP_Moderate_desc:0 "§YLevel§! §L6§! §YEconomy Size§!\n\n§YRelative Standing:§! §LAbove 1.00% of World Economy§! §7(Your Share: [?percentage_of_GDP|0..2]%)§!\n§YFloor Required:§! §W$2B§!\n\n§CRefreshes Every Month§!\n\n§LA functioning, self-sustaining economy that neither dazzles nor embarrasses.§! Tax revenues cover government expenditures in most years. Industry is diversified enough that no single failure is catastrophic. A banking sector exists and is trusted. §LNot powerful enough to project force beyond its borders, not weak enough to be at anyone's mercy.§! Stable, unglamorous, quietly functional.\n\n§GA credible regional power. Can finance and sustain a modern military without emergency measures.§!"

  idea_GDP_Established:0 "§LEstablished Economy§!"
  idea_GDP_Established_desc:0 "§YLevel§! §L7§! §YEconomy Size§!\n\n§YRelative Standing:§! §LAbove 2.00% of World Economy§! §7(Your Share: [?percentage_of_GDP|0..2]%)§!\n§YFloor Required:§! §W$5B§!\n\n§CRefreshes Every Month§!\n\n§LDiversified industry, a real financial sector with international connections, and enough aggregate output to matter regionally.§! This economy can §Gfinance a modern military§! without emergency borrowing. It has institutions that produce engineers, factories that produce machines, and banks that produce capital. §GOther nations in the region notice its trade policy.§!\n\n§GA force in global economics. Construction and naval output are real. Capable of projecting power beyond its immediate borders.§!"

  idea_GDP_Substantial:0 "§GSubstantial Economy§!"
  idea_GDP_Substantial_desc:0 "§YLevel§! §G8§! §YEconomy Size§!\n\n§YRelative Standing:§! §GAbove 3.50% of World Economy§! §7(Your Share: [?percentage_of_GDP|0..2]%)§!\n§YFloor Required:§! §W$12B§!\n\n§CRefreshes Every Month§!\n\n§GA recognizable economic force on the continental scale.§! Industrial output is large enough to sustain a §Gserious military-industrial complex§! without gutting the civilian economy. The financial sector has international reach. §GResource shortfalls hurt but do not cripple§! — substitutes exist and can be found.\n\n§GA pillar of the regional order. Naval construction is viable. Wartime production ramps quickly and sustains well.§!"

  idea_GDP_Considerable:0 "§GConsiderable Economy§!"
  idea_GDP_Considerable_desc:0 "§YLevel§! §G9§! §YEconomy Size§!\n\n§YRelative Standing:§! §GAbove 6.00% of World Economy§! §7(Your Share: [?percentage_of_GDP|0..2]%)§!\n§YFloor Required:§! §W$25B§!\n\n§CRefreshes Every Month§!\n\n§GIndustrial output at this scale commands genuine respect on the world stage.§! Trade policy decisions made here ripple outward to smaller economies. The manufacturing sector is deep and diversified — steel, chemicals, machinery, and emerging industries all exist in meaningful volumes. §GThe military-industrial complex can sustain prolonged modern warfare§! without catastrophic civilian sacrifice.\n\n§GThe economy of a true great power. Foreign nations track its production figures with genuine attention.§!"

  idea_GDP_Powerful:0 "§GPowerful Economy§!"
  idea_GDP_Powerful_desc:0 "§YLevel§! §G10§! §YEconomy Size§!\n\n§YRelative Standing:§! §GAbove 9.00% of World Economy§! §7(Your Share: [?percentage_of_GDP|0..2]%)§!\n§YFloor Required:§! §W$50B§!\n\n§CRefreshes Every Month§!\n\n§GA genuine economic powerhouse.§! The currency is a major factor in regional and increasingly global trade. Factories operate around the clock. §GThe financial sector exports capital§! to developing economies and collects returns. Resource dependencies are managed through strategic stockpiles and an import network that reaches every corner of the globe.\n\n§GSuperpower-tier economic dominance. This economy does not just participate in the international order — it helps write its rules.§!"

  idea_GDP_Major:0 "§GMajor Economy§!"
  idea_GDP_Major_desc:0 "§YLevel§! §G11§! §YEconomy Size§!\n\n§YRelative Standing:§! §GAbove 13.0% of World Economy§! §7(Your Share: [?percentage_of_GDP|0..2]%)§!\n§YFloor Required:§! §W$90B§!\n\n§CRefreshes Every Month§!\n\n§GAmong the handful of truly consequential economies on earth.§! Industrial decisions made here — what to produce, what to buy, what to embargo — are felt in the balance sheets of nations on the other side of the world. §GThe manufacturing base is so deep that losing an entire industry to enemy action barely registers§! before substitutes are found. This economy can sustain total war, absorb catastrophic losses, reconstitute, and continue.\n\n§YRarity:§! §CExceptional. Requires a dominant continental position. The armed forces are inexhaustible by any normal metric of attrition.§!"

  idea_GDP_Dominant:0 "§CDominant Economy§!"
  idea_GDP_Dominant_desc:0 "§YLevel§! §C12§! §YEconomy Size§!\n\n§YRelative Standing:§! §CAbove 18.0% of World Economy§! §7(Your Share: [?percentage_of_GDP|0..2]%)§!\n§YFloor Required:§! §W$140B§!\n\n§CRefreshes Every Month§!\n\n§CContinental-scale economic gravity.§! Smaller economies don't just trade with this nation — they orbit it, structuring their own production around its demand and their own currencies around its stability. §CThe industrial base is so diversified that resource shortages are logistical inconveniences§! rather than strategic vulnerabilities. The military-industrial output, even in peacetime, exceeds what most nations could achieve at full mobilization.\n\n§YRarity:§! §CVery Rare. Continental economic dominance. Wars are won before they are fought.§!"

  idea_GDP_Paramount:0 "§CParamount Economy§!"
  idea_GDP_Paramount_desc:0 "§YLevel§! §C13§! §YEconomy Size§!\n\n§YRelative Standing:§! §CAbove 24.0% of World Economy§! §7(Your Share: [?percentage_of_GDP|0..2]%)§!\n§YFloor Required:§! §W$220B§!\n\n§CRefreshes Every Month§!\n\n§CA global economic force with no regional peer and few global ones.§! Output at this scale §Cexceeds the combined production of most continental coalitions§!. Raw materials flow in from every corner of the earth, finished goods flow out to every market. §CIn wartime, production curves that would take other nations years to achieve can be reached in months.§! This is not just an economy. It is a force of nature wearing a flag.\n\n§YRarity:§! §WNear-Impossible. Global economic supremacy. Strategic bombing of this economy is almost meaningless — the base is too wide to crater.§!"

  idea_GDP_Titan:0 "§CTitan Economy§!"
  idea_GDP_Titan_desc:0 "§YLevel§! §C14§! §YEconomy Size§!\n\n§YRelative Standing:§! §CAbove 35.0% of World Economy§! §7(Your Share: [?percentage_of_GDP|0..2]%)§!\n§YFloor Required:§! §W$400B§!\n\n§CRefreshes Every Month§!\n\n§CThe theoretical upper bound of what a nation-state could conceivably achieve.§! The industrial output is so immense that the limiting factor is no longer capital, labour, or resources — §Cit is the sheer organizational challenge of coordinating something this large§!. Every sector of the global economy is downstream of decisions made here. Allies are grateful. Enemies are calculating whether the math can possibly work in their favour. §CIt usually cannot.§!\n\n§YRarity:§! §WAlmost Impossible. This economy is the war. Defeating it militarily is not a realistic objective for any known combination of opponents.§!"

  idea_GDP_Hegemon:0 "§WHegemon Economy§!"
  idea_GDP_Hegemon_desc:0 "§WHighest Economy Size§!\n§YRelative Standing:§! §WAbove 50.0% of World Economy§! §7(Your Share: [?percentage_of_GDP|0..2]%)§!\n§YFloor Required:§! §W$700B§!\n\n§CRefreshes Every Month§!\n\n§WABSOLUTE ECONOMIC SUPREMACY§!\n\n§CThis number does not exist in any known era of human economic history.§! An economy of this scale would not merely dominate the global order — §Wit would constitute it§!. Every trade route, every commodity price, every currency exchange rate would be a downstream consequence of decisions made within its borders. Other nations would not have foreign policies so much as responses to its foreign policy.\n\n§WThis is the ceiling. There is nothing above this.§!\n§RHighest Economy Size Reached§!"

  # ── MAP MODE LOCALISATION ─────────────────────────────────────────────────────

  # State GDP Map Mode
  MAPMODE_ECO_STATE_GDP_MAP_MODE:0 "§YState GDP§!"
  MAPMODE_ECO_STATE_GDP_MAP_MODE_NAME:0 "State GDP"
  MAPMODE_ECO_STATE_GDP_MAP_MODE_DESCRIPTION:0 "Displays the §YGross Domestic Product§! of each state individually, reflecting its industrial output, resource wealth, and agricultural contribution. Darker §4blue§! states are economic powerhouses. §Oamber§! and §Rred§! states are economically marginal. §CRefreshes Every Quarter§!"

  ECO_state_GDP_map_mode_tooltip:0 "§Y[FROM.GetName]§!\n§WState GDP:§! §G[?FROM.state_GDP|3] B§!\n§WState GDP per Capita:§! §G[?FROM.state_GDP_per_capita|0]§!"
  ECO_state_GDP_map_mode_tooltip_delayed:0 "§Y[FROM.GetName]§!\n§WState GDP:§! §G[?FROM.state_GDP|3] B§!\n§WState GDP per Capita:§! §G[?FROM.state_GDP_per_capita|0]§!\n\n§CShows the productive output of this state, accounting for factory location quality, resources, and agriculture. §YUpdates quarterly.§!"

  # State GDP Per Capita Map Mode
  MAPMODE_ECO_STATE_GDP_PER_CAPITA_MAP_MODE:0 "§YState GDP p.C.§!"
  MAPMODE_ECO_STATE_GDP_PER_CAPITA_MAP_MODE_NAME:0 "State GDP Per Capita"
  MAPMODE_ECO_STATE_GDP_PER_CAPITA_MAP_MODE_DESCRIPTION:0 "Displays the §YGDP Per Capita§! of each state, showing the average economic output per person. A proxy for local §Yliving standards§! and workforce quality within a country's borders. §4Blue§! states have prosperous, productive populations. §Rred§! states are impoverished. §CRefreshes Every Quarter§!"

  ECO_state_GDP_per_capita_map_mode_tooltip:0 "§Y[FROM.GetName]§!\n§WState GDP per Capita:§! §G[?FROM.state_GDP_per_capita|0]§!\n§WState GDP:§! §G[?FROM.state_GDP|3] B§!"
  ECO_state_GDP_per_capita_map_mode_tooltip_delayed:0 "§Y[FROM.GetName]§!\n§WState GDP per Capita:§! §G$[?FROM.state_GDP_per_capita|0]§!\n§WState GDP:§! §G[?FROM.state_GDP|3] B§!\n\n§7Updates quarterly.§!"

