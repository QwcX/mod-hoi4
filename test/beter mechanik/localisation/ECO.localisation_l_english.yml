 # ── STATE STANDARDS OF LIVING — 75-combination descriptions ─────────────────
 # ── ABJECT (Level 1) ──────────────────────────────────────────────
 state_SoL_abject_metro:0 "§RAbject Metropolis — Level 1§!\n§RA densely populated region in name only.§! The infrastructure has §Rcollapsed under the weight of its own population§! — disease, starvation, and violence fill the gap left by absent governance. §RWhat industry existed has been looted or destroyed.§! This is not poverty. This is catastrophe made permanent."
 state_SoL_abject_urban:0 "§RAbject Industrial District — Level 1§!\n§RNothing functions.§! The machines are silent, §Rthe workforce has scattered§!, the structures are occupied by people with nowhere else to be. §RNo wage, no supply, no output§!. What was once an industrial district is §Rnow a ruin with a population§! that doesn't know where else to go."
 state_SoL_abject_agrarian:0 "§RAbject Farmland — Level 1§!\n§RStarvation is not a crisis here — it is the baseline.§! §RThe fields yield nothing meaningful§!, tools are broken or absent, §Rthe harvest is a recurring disappointment§! that grows worse with each season of exhausted soil. The people who remain do so because they have no means to leave."
 state_SoL_abject_rural:0 "§RAbject Countryside — Level 1§!\n§RThere is nothing here.§! No functioning economy, no extractable surplus, §Rno population large enough to matter§! to any calculation except a census. §RThe land exists.§! Nothing productive happens on it."
 state_SoL_abject_wasteland:0 "§RAbject Periphery — Level 1§!\n§RThis territory has been forgotten by everyone, including the people in it.§! §RNo roads reach it§!, no markets serve it, no authority administers it. §RThe population — what little remains — survives§! on terms no census has ever captured. It is the edge of the map. Beyond it, nothing."
 # ── SQUALID (Level 2) ──────────────────────────────────────────────
 state_SoL_squalid_metro:0 "§RSqualid Metropolis — Level 2§!\n§RA densely populated region collapsing under its own weight.§! §ROpen sewers between settlements§!. §RDisease is endemic§!. What industry exists is predatory — paying nothing, demanding everything. §RGovernance has retreated.§! This region is not struggling. It is failing."
 state_SoL_squalid_urban:0 "§RSqualid Industrial District — Level 2§!\n§RThe factory shells remain§! but machinery is idle or scavenged. Workers who haven't fled §Rsurvive on whatever the informal economy provides§!. There is no wage, no supply chain, and §Rno prospect of recovery without outside intervention.§!"
 state_SoL_squalid_agrarian:0 "§RSqualid Fields — Level 2§!\n§RThe fields are not enough.§! Whether from drought, landlord extraction, war damage, or §Rexhausted soil§! — this region cannot feed itself. §RWhat little surplus once existed has been consumed.§! §RThe people are leaving. Or dying.§!"
 state_SoL_squalid_rural:0 "§RSqualid Countryside — Level 2§!\n§RThe land has been stripped and left.§! §RWhatever was here has been extracted§! by those who moved on. What remains is a §Rscattered remnant population§! with no tools, no market, no future. This territory exists on maps. Nowhere else."
 state_SoL_squalid_wasteland:0 "§RSqualid Periphery — Level 2§!\n§RThe extraction stopped and the people didn't leave — or couldn't.§! §RWhat remains is a skeleton§! of the operation: broken equipment, collapsed structures, a population §Rthat subsists on whatever the gutted land still yields§!. There is no recovery coming."
 # ── HARDSCRABBLE (Level 3) ──────────────────────────────────────────────
 state_SoL_hardscrabble_metro:0 "§RStruggling Metropolis — Level 3§!\n§RA densely populated region in acute distress.§! §RDisease spreads through overcrowded settlements§! unchecked. §REmployment is a lottery§! most lose. What industry remains pays §Rbelow survival wages§!. §RThis region is not functioning — it is enduring.§!"
 state_SoL_hardscrabble_urban:0 "§RStruggling Industrial Zone — Level 3§!\n§RThe factory floors are barely maintained§!, wages a gesture rather than a salary. §RWorkers sleep in shifts§! in shared dormitories. §RChild mortality is high§!. The operators extract what they can and reinvest nothing. This industrial region is consuming itself."
 state_SoL_hardscrabble_agrarian:0 "§RStruggling Farmland — Level 3§!\n§RSubsistence farming, no surplus, no tools.§! The land is the entire world — mud floors, unreliable wells, §Rseasons that determine whether the family eats§!. There is no market to sell to. There is no surplus to sell. §RThis is survival, not agriculture.§!"
 state_SoL_hardscrabble_rural:0 "§RStruggling Settlements — Level 3§!\n§RThe land yields almost nothing§! and the people on it know it. §RNo roads, no equipment§!, no reason to stay except nowhere better to go. What little extraction happens is by hand and produces enough to eat and nothing else. This region is endured, not inhabited."
 state_SoL_hardscrabble_wasteland:0 "§RStruggling Periphery — Level 3§!\n§RThe land yields almost nothing.§! A handful of people scratch at the surface for subsistence. §RNo roads, no equipment§!, no reason to stay — and no means to leave. What little comes out of the ground barely covers the cost of being here."
 # ── GRIMY (Level 4) ──────────────────────────────────────────────
 state_SoL_grimy_metro:0 "§OGrimy Metropolis — Level 4§!\n§OA region that failed to grow into its own ambitions.§! §RTenements pack six to a room§!, sewers overflow, healthcare turns away those who can't pay. §OIndustry exists but pays poverty wages§!. §RThe wealthy live behind walls. The rest live outside them.§!"
 state_SoL_grimy_urban:0 "§OGrimy Industrial District — Level 4§!\n§OThe factories run on desperation.§! §RWages are below subsistence§!, hours unlimited, and injuries are the worker's problem. §OWhat little the workers earn§! is extracted back by the company store and the landlord. §RA district in which labour has no rights and exercises none.§!"
 state_SoL_grimy_agrarian:0 "§OGrimy Farming Region — Level 4§!\n§OThe worst of both worlds.§! §RFarms have been abandoned§! or consolidated by absentee landlords. The factories that replaced them pay §Rwages below what the fields used to yield§!. The workforce is trapped between a dying agricultural economy and a predatory industrial one."
 state_SoL_grimy_rural:0 "§OGrimy Settlements — Level 4§!\n§OThe fields barely yield enough to survive.§! §RThe landlord takes the majority§!, leaving the farmers with what cannot be seized. §ONo surplus§!, no savings, no equipment beyond what was inherited in poor condition. A region that has forgotten what good seasons feel like."
 state_SoL_grimy_wasteland:0 "§OGrimy Periphery — Level 4§!\n§OA camp rather than a community.§! §RScratch extraction§! — minimal equipment, no infrastructure, workers who arrived with nothing and are saving nothing. §OThe resource is real§!, the operation barely functional. A place that extracts and discards both ore and men."
 # ── MEAGER (Level 5) ──────────────────────────────────────────────
 state_SoL_meager_metro:0 "§OMiddling Urban Core — Level 5§!\n§OA region that outgrew its means.§! Vast informal settlements sprawl across the landscape. §OThe sewers don't reach the outskirts§!, schools are oversubscribed, §Ohealthcare is for those who can pay§!. Industry exists but captures the wealth before it circulates. §RA region of many people generating little prosperity for most of them.§!"
 state_SoL_meager_urban:0 "§OMiddling Industrial Region — Level 5§!\n§OThe factory whistle blows but wages barely cover bread.§! §OChild labour is common§! where the law allows, and the law is permissive. §OWorkers have no union§!, no recourse, no expectation of improvement. §RA region that works itself to exhaustion for someone else's profit.§!"
 state_SoL_meager_agrarian:0 "§OMiddling Farming Region — Level 5§!\n§OThe factories are here, but the workers wish they weren't.§! §OWages barely exceed what subsistence farming paid§!, conditions are dangerous, and the promised prosperity of industrialisation §Ohas not materialized for the people doing the work§!. The fields remain more honest than the factory floors."
 state_SoL_meager_rural:0 "§OMiddling Settlements — Level 5§!\n§OThe fields are worked by hand§!, the roads are mud, §Othe harvest feeds the landlord first§!. What remains goes to the family — if enough remains. §ODebt is a permanent condition§!, inherited and passed on. The nearest market is a long walk and prices are set by someone else."
 state_SoL_meager_wasteland:0 "§OMiddling Periphery — Level 5§!\n§ONothing grows easily here§! and extraction is inefficient and poorly compensated. §OThe population is too small§!, the equipment too primitive, the connection to any market §Otoo tenuous§! to generate meaningful output. §RWhatever wealth exists in the ground stays there.§!"
 # ── DECENT (Level 6) ──────────────────────────────────────────────
 state_SoL_decent_metro:0 "§YDecent Metropolis — Level 6§!\n§YA large region with large problems.§! §OThe population grew faster than the infrastructure§! — overcrowded settlements, overloaded transit, healthcare at its limit. §YBut commerce moves§!, factories produce, the region survives. It could be much worse. It has been."
 state_SoL_decent_urban:0 "§YDecent Industrial Region — Level 6§!\n§YThe factories pay§! — not well, but they pay. §OWorkers cover food and rent§! if nothing goes wrong. §YA month of illness ends that balance§!. The children work summers. The union is weak. A region that functions, barely, because the alternative is worse."
 state_SoL_decent_agrarian:0 "§YDecent Farming Region — Level 6§!\n§YThe first workshops and small factories have appeared§!, but the transition is fragile. Most people still farm. §OIndustrial wages are low§!, conditions unregulated. The promise of modernity feels more distant than the recruiters suggested. The region is changing — for better or worse remains to be seen."
 state_SoL_decent_rural:0 "§YDecent Rural Region — Level 6§!\n§YThe harvest feeds the family and sometimes the market.§! §OThe roads are unpaved§! but passable. §YDebt is present but not crushing — yet§!. The landlord takes his share, the market takes its cut, and what remains is enough to try again next season."
 state_SoL_decent_wasteland:0 "§YDecent Periphery — Level 6§!\n§YSomething is being extracted here§!, but §Othe infrastructure is thin§! and the workforce too small to work it efficiently. §YOutput is real but well below potential.§! The land has value — the question is whether anyone has the means to unlock it."
 # ── COMFORTABLE (Level 7) ──────────────────────────────────────────────
 state_SoL_comfortable_metro:0 "§YComfortable Metropolis — Level 7§!\n§YA region that feeds and employs its people§! — mostly. §YInfrastructure is strained§!, deprivation is visible from the wealthier districts, §Yhealthcare turns some away§!. But commerce moves. A middle class exists, even if anxious. Not a great region. A functioning one."
 state_SoL_comfortable_urban:0 "§YComfortable Industrial Region — Level 7§!\n§YThe factory wages are enough to live on§!, if carefully. §YRent is manageable, food available§!, children go to school for several years. §YNo savings§!, but no starvation either. A region at the lower edge of decent — aware of both directions from here."
 state_SoL_comfortable_agrarian:0 "§YComfortable Farming Region — Level 7§!\n§YIndustrialisation has begun§! and is producing visible results — some of them good. First factory wages are lifting families out of subsistence. §YAgriculture is still the backbone§!, but its grip is loosening as options multiply. A region on the cusp of real change."
 state_SoL_comfortable_rural:0 "§YComfortable Rural Region — Level 7§!\n§YThe fields produce enough§! and the markets are accessible. §YNot comfortable by any urban standard§!, but by rural standards — market access, a school, a dry roof — §Ythis region is doing adequately.§! Subsistence that crosses the line into modest sufficiency."
 state_SoL_comfortable_wasteland:0 "§YComfortable Periphery — Level 7§!\n§YExtraction is modest and wages are thin§!, but they are present. §YA remote community that pays its own way§! — barely, but genuinely. The people here chose this life, or were born into it, and it is livable — which is more than can be said for many."
 # ── ROBUST (Level 8) ──────────────────────────────────────────────
 state_SoL_robust_metro:0 "§YWell-Off Metropolis — Level 8§!\n§YA region that works§! — not glamorously, but persistently. The factories run, the transit runs, most people have enough. §YThe gap between rich and poor is visible§! but not catastrophic. A region that hasn't fulfilled its ambitions yet, but hasn't given up."
 state_SoL_robust_urban:0 "§YWell-Off Industrial Region — Level 8§!\n§YWages cover necessities with something left over — sometimes.§! Shift work, modest housing, modest expectations. §YThe factories run, the workers show up§!. No comfort to spare, but there is employment, and employment is the difference."
 state_SoL_robust_agrarian:0 "§YWell-Off Farming Region — Level 8§!\n§YThe first factories have arrived and the wages are real§!, if modest. Agriculture still dominates the landscape but §Ythe balance is shifting§!. Workers who used to farm are learning trades. Progress is visible — slow, genuine, forward."
 state_SoL_robust_rural:0 "§YWell-Off Rural Region — Level 8§!\n§YEnough to eat, occasionally enough to sell.§! The market is reachable. §YChildren attend school when the harvest allows.§! The land is not mechanized but it is productive. Progress is possible — not guaranteed, but possible."
 state_SoL_robust_wasteland:0 "§YWell-Off Periphery — Level 8§!\n§YSomething is being extracted and the workers are paid for it.§! §YInfrastructure is thin§! and the workforce small, but the output is real and the wages are honest. A remote region with a purpose, however modest."
 # ── VIBRANT (Level 9) ──────────────────────────────────────────────
 state_SoL_vibrant_metro:0 "§GProsperous Metropolis — Level 9§!\n§GA region finding its footing.§! Commerce is active, the population is employed, §Gsome districts are genuinely pleasant§!. Infrastructure creaks in places. But this region is growing into something — the gap between where it is and where it could be is closing."
 state_SoL_vibrant_urban:0 "§GProsperous Industrial Region — Level 9§!\n§GThe factories run and the wages are real.§! Not generous — §Gbut real enough that workers stay, families form, and the local economy turns§!. The weekend has meaning. The children know their letters. A region that functions."
 state_SoL_vibrant_agrarian:0 "§GProsperous Farming Region — Level 9§!\n§GThe industrial seed is planted and growing.§! §GFirst-generation factory workers§! earn more than their farming parents did, while the farms remain productive. The transition is underway — messy in places, promising overall."
 state_SoL_vibrant_rural:0 "§GProsperous Rural Region — Level 9§!\n§GThe harvest is consistent and the surplus is real.§! §GFarmers are not wealthy but not subsisting§! — farming commercially, with market access and functioning equipment. A region finding its way into modernity."
 state_SoL_vibrant_wasteland:0 "§GProsperous Periphery — Level 9§!\n§GSomething valuable is in the ground here§!, and the people working it earn enough to stay. §GOperation functional§!, equipment adequate, wages modest but present. A remote region that has found its rhythm."
 # ── PROSPEROUS (Level 10) ──────────────────────────────────────────────
 state_SoL_prosperous_metro:0 "§GAffluent Metropolis — Level 10§!\n§GA busy, commercially active region with genuine momentum.§! Transit lines connect the districts. §GThe middle class exists and knows its own name.§! Destitution present but not dominant. Healthcare turns no one away — usually. A region with ambitions it is slowly fulfilling."
 state_SoL_prosperous_urban:0 "§GAffluent Industrial Region — Level 10§!\n§GWorkers earn a living wage and occasionally more.§! The union is recognized. Shift work is hard but rent gets paid. §GSchools stay open past primary age.§! A functioning industrial region — not glamorous, but dignified."
 state_SoL_prosperous_agrarian:0 "§GAffluent Farming Region — Level 10§!\n§GOrganized markets, solid roads§!, a nascent industrial sector adding wages alongside agricultural income. Farmers are not rich but §Gnot hungry either§!. The factory recruits from the same families that work the fields. A region on a genuine upward trajectory."
 state_SoL_prosperous_rural:0 "§GAffluent Rural Region — Level 10§!\n§GExtraction and farming both organized and productive.§! Workers are compensated. Output is consistent. §GNot the richest ground — but a real one§!, properly worked by a workforce that stays."
 state_SoL_prosperous_wasteland:0 "§GAffluent Periphery — Level 10§!\n§GExtraction is organized and workers are compensated.§! Worker housing maintained. Operation experienced and consistent. §GNot the richest vein — but a real one§!, properly worked by a workforce that stays."
 # ── OPULENT (Level 11) ──────────────────────────────────────────────
 state_SoL_opulent_metro:0 "§GRich Metropolis — Level 11§!\n§GA large, functioning region with real prosperity across its districts.§! Wealthy areas are genuinely wealthy, §Gthe working class earns enough§!. Commerce moves, institutions function, §Gthe region produces more than it consumes§!. Room to improve — nothing to be ashamed of."
 state_SoL_opulent_urban:0 "§GRich Industrial Region — Level 11§!\n§GFactory wages cover necessities and then some.§! §GWorkers are organized§!, management knows not to push too hard. §GSome discretionary income§! filters through the local economy. A region with its industrial footing firmly planted."
 state_SoL_opulent_agrarian:0 "§GRich Farming Region — Level 11§!\n§GThe balance between old and new is working in everyone's favour.§! Agriculture feeds the region while §Gemerging industry adds wages and variety§!. Workers have options. Neither sector exploits the other."
 state_SoL_opulent_rural:0 "§GRich Rural Region — Level 11§!\n§GEnough surplus to sell, enough savings to survive a bad year.§! §GRoads connect farms to markets§!, markets offer fair prices. Children are educated. §GProsperous rural life§!, without pretension."
 state_SoL_opulent_wasteland:0 "§GRich Periphery — Level 11§!\n§GThe extraction here works.§! Workers receive wages worth receiving, housing is adequate, operation shows no signs of stopping. §GNot the richest find — but a real one, properly managed§! by people who know what they're doing."
 # ── GILDED (Level 12) ──────────────────────────────────────────────
 state_SoL_gilded_metro:0 "§GWealthy Metropolis — Level 12§!\n§GA prosperous, confident region.§! Commerce districts are stocked, cultural venues full, the §Gmiddle class has genuine spending power§!. The poor exist but do not define the region. Institutions work. This is what other regions aspire to become."
 state_SoL_gilded_urban:0 "§GWealthy Industrial Region — Level 12§!\n§GWorkers earn enough to own furniture, pay rent, and occasionally afford a luxury.§! §GUnion membership is strong§!, conditions negotiated. §GSkileld trades are well-compensated.§! A region where industrial work leads to a life worth living."
 state_SoL_gilded_agrarian:0 "§GWealthy Farming Region — Level 12§!\n§GIndustrialisation is well underway and broadly beneficial.§! §GFactory floors pay decent wages§!, remaining farms are organized and surplus-generating. The workforce is transitioning with purpose, not desperation. This region is building something."
 state_SoL_gilded_rural:0 "§GWealthy Rural Region — Level 12§!\n§GWell-organized farming with genuine market surplus.§! §GFarm families are comfortable§! — debt manageable, harvest predictable, children in school. The countryside that works."
 state_SoL_gilded_wasteland:0 "§GWealthy Periphery — Level 12§!\n§GConsistent extraction at real scale§!, workers paid fairly. §GOperation organized, equipment functional§!, output reliable. Not glamorous — but the kind of region that pays its people and maintains itself."
 # ── RADIANT (Level 13) ──────────────────────────────────────────────
 state_SoL_radiant_metro:0 "§CLavish Metropolis — Level 13§!\n§CA world-class region by every measure.§! Commerce is diverse, the professionals are educated, §Cthe infrastructure functions without apology§!. Not the richest on earth, but in honest contention. The kind of place people move toward."
 state_SoL_radiant_urban:0 "§CLavish Industrial Region — Level 13§!\n§CHigh wages, functioning unions, factory floors that run on expertise rather than desperation.§! §CWorkers retire with savings.§! Healthcare reaches everyone. This region has figured out how to make industry work for the people in it."
 state_SoL_radiant_agrarian:0 "§CLavish Farming Region — Level 13§!\n§CA region actively and successfully industrialising§! while its agricultural base remains productive. Workers move between sectors with ease. §GThe transition is real, organized, and generating genuine prosperity on both the fields and the factory floors.§!"
 state_SoL_radiant_rural:0 "§CLavish Rural Region — Level 13§!\n§CFertile land under capable management§!, with road access, organized markets, genuine surplus. §CFarm families own their land§!, educate their children, and eat well year-round. The countryside at its civilized best."
 state_SoL_radiant_wasteland:0 "§CLavish Periphery — Level 13§!\n§CExtraction organized, productive, well-compensated.§! Skilled workforce, efficient operation. §CWorker housing maintained§!, wages honest. A remote region that is genuinely worth living in."
 # ── TRANSCENDENTAL (Level 14) ──────────────────────────────────────────────
 state_SoL_transcendental_metro:0 "§CExtravagant Metropolis — Level 14§!\n§COne of the great productive regions of the world.§! The financial and industrial districts move more wealth in a week than most nations produce in a year. §CThe middle class is enormous, well-fed, and politically confident.§! Destitution exists only in the statistical margins."
 state_SoL_transcendental_urban:0 "§CExtravagant Industrial Region — Level 14§!\n§CThe most productive factory floors on earth§!, built on precision engineering and a generation of skilled labour. §CWages are high, turnover is low§!, workers own their homes. §WA region that has genuinely arrived — and knows it.§!"
 state_SoL_transcendental_agrarian:0 "§CExtravagant Farming Region — Level 14§!\n§CFarm income is indistinguishable from professional wages.§! Equipment is modern, markets are organized, §Cthe surplus feeds half the continent§!. Agricultural science is practiced, not just tradition. The envy of every farming region on earth."
 state_SoL_transcendental_rural:0 "§CExtravagant Rural Region — Level 14§!\n§CFarm income here rivals professional wages§! thanks to mechanization, cooperative organization, and serious market access. §CEvery household has reliable electricity.§! Children attend school full-time. The rural-urban income gap has nearly closed."
 state_SoL_transcendental_wasteland:0 "§CExtravagant Periphery — Level 14§!\n§CThe richest veins, the most efficient extraction§!, workers compensated at rates that would embarrass most factory managers. §CWorker settlements with real amenities§! — schools, hospitals, electricity. The land here pays handsomely."
 # ── UTOPIAN (Level 15) ──────────────────────────────────────────────
 state_SoL_utopian_metro:0 "§WOpulent Metropolis — Level 15§!\n§WThis region should not exist.§! Glass towers, automated transit, workers measured in gold rather than subsistence. Every bank, exchange, and empire of consequence has a headquarters here. §WThe absolute ceiling of what human civilization has concentrated in one place.§!"
 state_SoL_utopian_urban:0 "§WOpulent Industrial Region — Level 15§!\n§WThe factories here produce things other nations haven't invented yet.§! Workers earn wages that would embarrass a metropolitan banker. §WEngineers and chemists§! fill every shift. The unions negotiate from pure strength. §CHistory will remember what came out of this place.§!"
 state_SoL_utopian_agrarian:0 "§WOpulent Farming Region — Level 15§!\nFarm income here is indistinguishable from professional wages. §WThe fields are fully mechanized, the cooperatives dominant, the roads immaculate.§! The concept of a bad harvest has been engineered out of existence. §CA countryside the rest of the world calls impossible.§!"
 state_SoL_utopian_rural:0 "§WOpulent Rural Region — Level 15§!\n§WFarm income rivals any professional salary.§! Every household has running water, electricity, and a radio. §WMechanization is total and the cooperatives are powerful.§! This is what the countryside looks like when a nation decides to invest in it properly. §CA model that no one else has managed to replicate.§!"
 state_SoL_utopian_wasteland:0 "§WOpulent Periphery — Level 15§!\n§WThe extraction here generates wealth so concentrated§! that even roughnecks and foremen live like minor aristocracy. §WCompany settlements with genuine luxury§! — pools, libraries, theatres. The earth decided to be generous here, and the people had the wit to capture it entirely."